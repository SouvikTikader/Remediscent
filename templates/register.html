{% extends 'base.html' %}
{% block auth_content %}
<form method="POST">
  <div class="mb-3">
    <label class="form-label">Full Name *</label>
    <input name="name" class="form-control" required autofocus>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-6">
      <label class="form-label">Age</label>
      <input name="age" type="number" min="0" max="120" class="form-control">
    </div>
    <div class="col-6">
      <label class="form-label">Gender</label>
      <select name="gender" class="form-select">
        <option value="">—</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>
  </div>

  <div class="row g-2 mb-1">
    <div class="col-6">
      <label class="form-label">Height (cm)</label>
      <input name="height_cm" type="number" step="0.1" min="0" class="form-control">
    </div>
    <div class="col-6">
      <label class="form-label">Weight (kg)</label>
      <input name="weight_kg" type="number" step="0.1" min="0" class="form-control">
    </div>
  </div>
  <div class="form-text mb-3">Your BMI is calculated automatically from these.</div>

  <div class="row g-2 mb-3">
    <div class="col-6">
      <label class="form-label">Blood Group</label>
      <select name="blood_group" class="form-select">
        <option value="">—</option>
        {% for bg in ['A+','A-','B+','B-','AB+','AB-','O+','O-'] %}
          <option>{{ bg }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-6">
      <label class="form-label">Phone</label>
      <input name="phone" class="form-control">
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">Email *</label>
    <input type="email" name="email" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Password *</label>
    <input type="password" name="password" class="form-control" required minlength="6">
  </div>

  <button class="btn btn-primary w-100 py-2">Create account</button>
</form>
<p class="mt-3 mb-0 text-center small text-muted">
  Already registered? <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">Sign in</a>
</p>
{% endblock %}
