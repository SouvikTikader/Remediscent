{% extends 'base.html' %}
{% block auth_content %}
<form method="POST">
  <div class="mb-3">
    <label class="form-label">Full Name</label>
    <input name="name" class="form-control" required autofocus>
  </div>
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" name="password" class="form-control" required minlength="6">
  </div>
  <button class="btn btn-primary w-100 py-2">Create account</button>
</form>
<p class="mt-3 mb-0 text-center small text-muted">
  Already registered? <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">Sign in</a>
</p>
{% endblock %}
