{% extends 'base.html' %}
{% block content %}
<h2 class="mb-3">Alerts</h2>

<div class="card shadow-sm">
  <ul class="list-group list-group-flush">
    {% for n in notifications %}
      <li class="list-group-item d-flex justify-content-between align-items-start
                 {% if n.status=='unread' %}list-group-item-light{% endif %}">
        <div>
          <span class="badge bg-info text-dark me-2">{{ n.type }}</span>
          {{ n.message }}
          <div class="small text-muted">{{ n.created_at.strftime('%d %b %Y %H:%M') }}</div>
        </div>
        {% if n.status == 'unread' %}
          <form method="POST" action="{{ url_for('mark_read', nid=n.id) }}">
            <button class="btn btn-sm btn-outline-secondary">Mark read</button>
          </form>
        {% endif %}
      </li>
    {% else %}
      <li class="list-group-item text-muted text-center py-4">No alerts.</li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
