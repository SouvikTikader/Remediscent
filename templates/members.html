{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Family Members</h2>

<div class="row g-4">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-header"><strong>Add Member</strong></div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-2"><input name="name" class="form-control" placeholder="Name" required></div>
          <div class="mb-2"><input name="relationship" class="form-control" placeholder="Relationship (e.g. Mother)"></div>
          <div class="mb-3"><input name="age" type="number" class="form-control" placeholder="Age"></div>
          <button class="btn btn-primary w-100">Add</button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-7">
    <div class="card shadow-sm">
      <div class="card-header"><strong>Members</strong></div>
      <table class="table mb-0">
        <thead><tr><th>Name</th><th>Relationship</th><th>Age</th><th></th></tr></thead>
        <tbody>
        {% for m in members %}
          <tr>
            <td>{{ m.name }}</td>
            <td>{{ m.relationship or '—' }}</td>
            <td>{{ m.age or '—' }}</td>
            <td class="text-end">
              <form method="POST" action="{{ url_for('delete_member', mid=m.id) }}"
                    onsubmit="return confirm('Delete member and all their medicines?')">
                <button class="btn btn-sm btn-outline-danger">Delete</button>
              </form>
            </td>
          </tr>
        {% else %}
          <tr><td colspan="4" class="text-center text-muted py-3">No members yet.</td></tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
