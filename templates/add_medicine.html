{% extends 'base.html' %}
{% block content %}
<h2 class="mb-3">Add Medicine</h2>

<div class="card shadow-sm">
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Family Member *</label>
          <select name="member_id" class="form-select" required>
            <option value="">— select —</option>
            {% for m in members %}
              <option value="{{ m.id }}">{{ m.name }} ({{ m.relationship or 'member' }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Medicine Name *</label>
          <input name="name" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Generic Name</label>
          <input name="generic_name" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label">Category</label>
          <input name="category" class="form-control" placeholder="e.g. Antibiotic">
        </div>
        <div class="col-md-4">
          <label class="form-label">Dosage</label>
          <input name="dosage" class="form-control" placeholder="e.g. 500mg">
        </div>
        <div class="col-md-4">
          <label class="form-label">Quantity</label>
          <input name="quantity" type="number" min="0" value="0" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label">Unit</label>
          <input name="unit" class="form-control" value="tablets">
        </div>
        <div class="col-md-4">
          <label class="form-label">Expiry Date</label>
          <input name="expiry_date" type="date" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label">Batch Number</label>
          <input name="batch_number" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label">Manufacturer</label>
          <input name="manufacturer" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label">Daily Usage</label>
          <input name="daily_usage" type="number" step="0.1" value="1.0" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label">Minimum Stock</label>
          <input name="minimum_stock" type="number" value="5" class="form-control">
        </div>
      </div>
      <div class="mt-4">
        <button class="btn btn-primary">Save</button>
        <a href="{{ url_for('medicines') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
